<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时手势 3D 粒子舞台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08090d;
            --panel: rgba(18, 20, 26, 0.9);
            --text: #eef1f8;
            --accent: #6cf0ff;
            --card: rgba(255, 255, 255, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 20%, rgba(108, 240, 255, 0.08), transparent 35%),
                        radial-gradient(circle at 80% 10%, rgba(255, 106, 186, 0.08), transparent 35%),
                        linear-gradient(145deg, #0c0f1a 0%, #05060b 55%, #0b0f1c 100%);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            position: relative;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        header {
            padding: 28px clamp(20px, 4vw, 48px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .title-block h1 {
            font-size: clamp(28px, 2.8vw, 40px);
            letter-spacing: 0.5px;
        }

        .title-block p {
            color: #9ca2b8;
            margin-top: 6px;
        }

        .badge {
            background: rgba(108, 240, 255, 0.12);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(108, 240, 255, 0.4);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        main {
            display: grid;
            grid-template-columns: 1.2fr 420px;
            gap: clamp(14px, 2vw, 22px);
            padding: 0 clamp(20px, 4vw, 48px) clamp(20px, 3vw, 32px) clamp(20px, 4vw, 48px);
            width: 100%;
            box-sizing: border-box;
        }

        .canvas-wrap {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            background: radial-gradient(circle at 30% 20%, rgba(108, 240, 255, 0.08), transparent 25%),
                        radial-gradient(circle at 80% 80%, rgba(255, 106, 186, 0.06), transparent 30%),
                        #05070f;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .canvas-surface {
            width: 100%;
            height: min(72vh, 820px);
            display: block;
        }

        .hud {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .chip {
            backdrop-filter: blur(12px);
            background: rgba(12, 14, 22, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #cfd4e5;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        .chip strong {
            color: var(--accent);
        }

        .panel {
            background: var(--panel);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: "U";
            position: absolute;
            right: -20px;
            top: 20px;
            font-size: 160px;
            color: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            transform: rotate(-10deg);
            pointer-events: none;
        }

        .panel h2 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 14px;
            display: grid;
            gap: 10px;
        }

        label {
            color: #aeb5c9;
            font-size: 14px;
        }

        select, input[type="color"], button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            outline: none;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        select:focus, input[type="color"]:focus, button:focus {
            border-color: rgba(108, 240, 255, 0.6);
        }

        input[type="color"] {
            height: 46px;
            padding: 4px;
        }

        button {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
        }

        button.primary {
            background: linear-gradient(120deg, #6cf0ff, #7b8bff);
            color: #041018;
            border: none;
        }

        button.ghost {
            background: rgba(255, 255, 255, 0.04);
        }

        .status-list {
            list-style: none;
            display: grid;
            gap: 8px;
        }

        .status-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            color: #c8cee1;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555e75;
        }

        .status-dot.live { background: #6cf0ff; box-shadow: 0 0 0 6px rgba(108, 240, 255, 0.15); }
        .status-dot.idle { background: #ffc857; box-shadow: 0 0 0 6px rgba(255, 200, 87, 0.12); }

        .hint {
            font-size: 13px;
            color: #8f96ac;
            line-height: 1.6;
        }

        .video-feed {
            position: absolute;
            inset: 14px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: none;
        }

        .video-feed video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(1.1) contrast(1.05);
        }

        .top-actions {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        @media (max-width: 1100px) {
            main { grid-template-columns: 1fr; }
            .canvas-surface { height: 72vh; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="title-block">
            <div class="badge">实时交互 · 手势驱动 · Three.js</div>
            <h1>3D 粒子系统 · 手势舞台</h1>
            <p>张开手掌扩散粒子，握紧手掌收缩聚焦。实时捕捉手势驱动形态与颜色，探索心跳般的粒子雕塑。</p>
        </div>
        <button class="primary" id="fullscreen">⛶ 全屏展示</button>
    </header>

    <main>
        <div class="canvas-wrap" id="stage">
            <canvas id="scene" class="canvas-surface"></canvas>
            <div class="hud">
                <div class="chip">手势状态：<strong id="gestureLabel">等待手势…</strong></div>
                <div class="chip">粒子数量：<strong id="particleCount">-</strong></div>
            </div>
        </div>

        <aside class="panel">
            <div>
                <h2>U 控制面板</h2>
                <p class="hint">选择模型、调色，打开摄像头后用手势控制粒子缩放与扩散。</p>
            </div>

            <div class="control-group">
                <label for="shapeSelect">模型选择</label>
                <select id="shapeSelect">
                    <option value="heart">爱心</option>
                    <option value="flower">花朵</option>
                    <option value="star">王星</option>
                    <option value="buddha">佛像</option>
                    <option value="firework">烟花</option>
                </select>
            </div>

            <div class="control-group">
                <label for="colorPicker">粒子颜色</label>
                <input type="color" id="colorPicker" value="#6cf0ff">
            </div>

            <div class="control-group">
                <label>系统状态</label>
                <ul class="status-list">
                    <li class="status-item">摄像头 <span class="status-dot" id="cameraDot"></span></li>
                    <li class="status-item">手势 <span class="status-dot" id="gestureDot"></span></li>
                    <li class="status-item">实时响应 <span class="status-dot live"></span></li>
                </ul>
            </div>

            <div class="control-group">
                <div class="top-actions">
                    <button class="ghost" id="startCameraBtn">启动摄像头</button>
                    <button class="ghost" id="toggleVideo">显示手势画面</button>
                </div>
                <div class="top-actions">
                    <button class="ghost" id="recenter">重新聚焦</button>
                </div>
                <p class="hint">· 首次点击“启动摄像头”以授权并开启手势捕捉<br>· 张开手掌：扩散并放大粒子<br>· 握紧手掌：收缩并聚合模型</p>
            </div>

            <div class="video-feed" id="videoBox">
                <video id="input_video" muted playsinline></video>
                <canvas class="output_canvas" id="output_canvas"></canvas>
            </div>
        </aside>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(canvas.clientWidth, canvas.clientHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060b, 0.16);

const camera = new THREE.PerspectiveCamera(55, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
camera.position.set(0, 0.6, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 1.2;
controls.maxDistance = 8;

const hemiLight = new THREE.HemisphereLight(0x8ac9ff, 0x0b0c18, 0.8);
scene.add(hemiLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.35);
dirLight.position.set(4, 6, 3);
scene.add(dirLight);

const particleCount = 8000;
const positions = new Float32Array(particleCount * 3);
const targetPositions = new Float32Array(particleCount * 3);
const velocities = new Float32Array(particleCount * 3);

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));

const material = new THREE.PointsMaterial({ size: 0.035, color: '#6cf0ff', transparent: true, opacity: 0.9, depthWrite: false });
material.onBeforeCompile = (shader) => {
    shader.fragmentShader = shader.fragmentShader.replace(
        '#include <clipping_planes_fragment>',
        '#include <clipping_planes_fragment>\nfloat d = distance(gl_PointCoord, vec2(0.5));\nfloat a = smoothstep(0.5, 0.2, d);\nif(a < 0.01) discard;\ngl_FragColor.a *= a;'
    );
};

const points = new THREE.Points(geometry, material);
scene.add(points);

document.getElementById('particleCount').textContent = particleCount.toLocaleString();

let currentShape = 'heart';
let spreadFactor = 0.35;
let scaleFactor = 1;
let handState = 'idle';
let cameraStarted = false;

const sdfSample = (fn, count, scale = 1.0, padding = 1.0) => {
    const result = [];
    let attempts = 0;
    const maxAttempts = count * 80;
    while (result.length < count && attempts < maxAttempts) {
        const p = new THREE.Vector3(
            (Math.random() * 2 - 1) * padding,
            (Math.random() * 2 - 1) * padding,
            (Math.random() * 2 - 1) * padding
        );
        if (fn(p.clone()) <= 0) {
            p.multiplyScalar(scale);
            result.push(p);
        }
        attempts++;
    }
    while (result.length < count) {
        result.push(new THREE.Vector3((Math.random() - 0.5) * scale, (Math.random() - 0.5) * scale, (Math.random() - 0.5) * scale));
    }
    return result;
};

const heartSDF = (p) => {
    const x = p.x, y = p.y, z = p.z;
    const a = x * x + (9 / 4) * y * y + z * z - 1;
    return a * a * a - x * x * z * z * z - (9 / 80) * y * y * z * z * z;
};

const flowerSDF = (p) => {
    const q = p.clone();
    const r = Math.sqrt(q.x * q.x + q.z * q.z);
    const petal = Math.sin(6 * Math.atan2(q.z, q.x)) * 0.35 + 0.65;
    const d = Math.abs(r - petal) - 0.15;
    return Math.max(d, Math.abs(q.y) - 0.25);
};

const starSDF = (p) => {
    const a = Math.atan2(p.z, p.x);
    const r = Math.sqrt(p.x * p.x + p.z * p.z);
    const spikes = 5;
    const m = Math.cos(spikes * a) * 0.35 + 0.65;
    const d = r - m;
    return Math.max(d, Math.abs(p.y) - 0.2);
};

const buddhaSDF = (p) => {
    const head = p.clone().sub(new THREE.Vector3(0, 0.55, 0));
    const body = p.clone().sub(new THREE.Vector3(0, 0, 0));
    const base = p.clone().sub(new THREE.Vector3(0, -0.35, 0));
    const headEllipsoid = head.set(head.x / 0.38, head.y / 0.55, head.z / 0.38).length() - 1.0;
    const bodyEllipse = body.set(body.x / 0.6, body.y / 0.7, body.z / 0.5).length() - 1.0;
    const legs = new THREE.Vector3(body.x, body.y + 0.3, body.z);
    const legEllipse = legs.set(legs.x / 0.9, legs.y / 0.35, legs.z / 0.7).length() - 1.0;
    const cushion = base.set(base.x / 1.05, base.y / 0.18, base.z / 1.05).length() - 1.0;
    return Math.min(Math.min(headEllipsoid, bodyEllipse), Math.min(legEllipse, cushion));
};

const fireworkPoints = (count) => {
    const res = [];
    for (let i = 0; i < count; i++) {
        const r = Math.pow(Math.random(), 0.5) * 1.2;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.cos(phi);
        const z = r * Math.sin(phi) * Math.sin(theta);
        res.push(new THREE.Vector3(x, y, z));
    }
    return res;
};

const shapeGenerators = {
    heart: () => sdfSample(heartSDF, particleCount, 1.25, 1.1),
    flower: () => sdfSample(flowerSDF, particleCount, 1.2, 1.15),
    star: () => sdfSample(starSDF, particleCount, 1.4, 1.25),
    buddha: () => sdfSample(buddhaSDF, particleCount, 1.1, 1.2),
    firework: () => fireworkPoints(particleCount)
};

const updateTargetPositions = (shapeKey) => {
    const generator = shapeGenerators[shapeKey] || shapeGenerators.heart;
    const pts = generator();
    for (let i = 0; i < particleCount; i++) {
        const p = pts[i];
        targetPositions[i * 3] = p.x;
        targetPositions[i * 3 + 1] = p.y;
        targetPositions[i * 3 + 2] = p.z;
    }
    geometry.attributes.position.needsUpdate = true;
};

updateTargetPositions(currentShape);

const gestureLabel = document.getElementById('gestureLabel');
const cameraDot = document.getElementById('cameraDot');
const gestureDot = document.getElementById('gestureDot');
const videoElement = document.getElementById('input_video');
const videoBox = document.getElementById('videoBox');
const outputCanvas = document.getElementById('output_canvas');
const outputCtx = outputCanvas.getContext('2d');
const startCameraBtn = document.getElementById('startCameraBtn');

let hands, cameraMP;
let cameraStarting = false;

const startCamera = async () => {
    if (cameraStarted || cameraStarting) return;
    cameraStarting = true;
    startCameraBtn.textContent = '启动中…';
    try {
        hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5,
        });
        hands.onResults(onResults);

        cameraMP = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        await cameraMP.start();
        cameraStarted = true;
        cameraDot.classList.add('live');
        startCameraBtn.textContent = '摄像头已开启';
        startCameraBtn.disabled = true;
    } catch (err) {
        console.error(err);
        gestureLabel.textContent = '摄像头被阻止，请检查权限';
        startCameraBtn.textContent = '重新尝试启动';
        cameraDot.classList.remove('live');
    } finally {
        cameraStarting = false;
    }
};

const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

const computeGesture = (landmarks) => {
    const tips = [4, 8, 12, 16, 20];
    const palmIndices = [0, 1, 5, 9, 13, 17];
    const center = palmIndices.reduce((acc, idx) => {
        acc.x += landmarks[idx].x;
        acc.y += landmarks[idx].y;
        acc.z += landmarks[idx].z;
        return acc;
    }, { x: 0, y: 0, z: 0 });
    center.x /= palmIndices.length;
    center.y /= palmIndices.length;
    center.z /= palmIndices.length;

    const distances = tips.map(idx => {
        const tip = landmarks[idx];
        const dx = tip.x - center.x;
        const dy = tip.y - center.y;
        const dz = tip.z - center.z;
        return Math.sqrt(dx * dx + dy * dy + dz * dz);
    });
    const avg = distances.reduce((a, b) => a + b, 0) / distances.length;
    const wrist = landmarks[0];
    const mid = landmarks[9];
    const palmSize = Math.sqrt(
        Math.pow(wrist.x - mid.x, 2) +
        Math.pow(wrist.y - mid.y, 2) +
        Math.pow(wrist.z - mid.z, 2)
    );
    const openness = clamp((avg / palmSize - 0.6) * 1.8, 0, 1);
    return openness;
};

const drawLandmarks = (results) => {
    if (!outputCanvas.width) {
        outputCanvas.width = videoElement.videoWidth;
        outputCanvas.height = videoElement.videoHeight;
    }
    outputCtx.save();
    outputCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
    outputCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
    if (results.multiHandLandmarks) {
        results.multiHandLandmarks.forEach(marks => {
            outputCtx.strokeStyle = '#6cf0ff';
            outputCtx.lineWidth = 3;
            outputCtx.beginPath();
            marks.forEach((p, i) => {
                const x = p.x * outputCanvas.width;
                const y = p.y * outputCanvas.height;
                if (i === 0) outputCtx.moveTo(x, y); else outputCtx.lineTo(x, y);
            });
            outputCtx.stroke();
        });
    }
    outputCtx.restore();
};

const onResults = (results) => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
        const openness = computeGesture(results.multiHandLandmarks[0]);
        spreadFactor = THREE.MathUtils.lerp(spreadFactor, openness, 0.2);
        scaleFactor = THREE.MathUtils.lerp(scaleFactor, THREE.MathUtils.lerp(0.65, 1.6, openness), 0.15);
        handState = openness > 0.5 ? 'open' : 'closed';
        gestureLabel.textContent = handState === 'open' ? '扩散 / 放大' : '收缩 / 聚焦';
        gestureDot.classList.add('live');
        drawLandmarks(results);
    } else {
        handState = 'idle';
        gestureLabel.textContent = '等待手势…';
        gestureDot.classList.remove('live');
    }
};

const animate = () => {
    requestAnimationFrame(animate);
    controls.update();
    const posAttr = geometry.getAttribute('position');
    const velAttr = geometry.getAttribute('velocity');
    for (let i = 0; i < particleCount; i++) {
        const ix = i * 3;
        const tx = targetPositions[ix] * scaleFactor;
        const ty = targetPositions[ix + 1] * scaleFactor;
        const tz = targetPositions[ix + 2] * scaleFactor;

        const px = posAttr.array[ix];
        const py = posAttr.array[ix + 1];
        const pz = posAttr.array[ix + 2];

        let vx = velAttr.array[ix];
        let vy = velAttr.array[ix + 1];
        let vz = velAttr.array[ix + 2];

        const noise = spreadFactor * 0.4;
        const accelStrength = spreadFactor > 0.5 ? 0.003 : 0.006;

        vx += (tx - px) * accelStrength + (Math.random() - 0.5) * noise * 0.002;
        vy += (ty - py) * accelStrength + (Math.random() - 0.5) * noise * 0.002;
        vz += (tz - pz) * accelStrength + (Math.random() - 0.5) * noise * 0.002;

        vx *= 0.92;
        vy *= 0.92;
        vz *= 0.92;

        posAttr.array[ix] = px + vx;
        posAttr.array[ix + 1] = py + vy;
        posAttr.array[ix + 2] = pz + vz;

        velAttr.array[ix] = vx;
        velAttr.array[ix + 1] = vy;
        velAttr.array[ix + 2] = vz;
    }
    posAttr.needsUpdate = true;
    renderer.render(scene, camera);
};

animate();

const resize = () => {
    const { clientWidth, clientHeight } = canvas;
    camera.aspect = clientWidth / clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(clientWidth, clientHeight);
};
window.addEventListener('resize', resize);

// UI bindings
const shapeSelect = document.getElementById('shapeSelect');
shapeSelect.addEventListener('change', (e) => {
    currentShape = e.target.value;
    updateTargetPositions(currentShape);
});

document.getElementById('colorPicker').addEventListener('input', (e) => {
    material.color.set(e.target.value);
});

startCameraBtn.addEventListener('click', startCamera);

document.getElementById('fullscreen').addEventListener('click', () => {
    const stage = document.getElementById('stage');
    if (!document.fullscreenElement) {
        stage.requestFullscreen?.();
    } else {
        document.exitFullscreen?.();
    }
});

document.getElementById('toggleVideo').addEventListener('click', () => {
    if (!cameraStarted && !cameraStarting) {
        startCamera();
    }
    videoBox.style.display = videoBox.style.display === 'block' ? 'none' : 'block';
});
