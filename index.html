<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红楼梦人物关系知识图谱</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(rgba(92, 24, 28, 0.7), rgba(173, 119, 61, 0.55)),
                url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            color: #433025;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            color: #f8f2e8;
            text-shadow: 0 4px 18px rgba(41, 21, 17, 0.45);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .control-panel {
            flex: 1;
            min-width: 300px;
            background: rgba(254, 248, 237, 0.94);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(67, 48, 37, 0.25);
            border: 1px solid rgba(150, 90, 60, 0.15);
            max-height: 1000px;
            overflow-y: auto;
        }
        
        .graph-container {
            flex: 3;
            min-width: 800px;
            height: 1000px;
            background: rgba(254, 248, 237, 0.94);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(67, 48, 37, 0.25);
            border: 1px solid rgba(150, 90, 60, 0.15);
            position: relative;
        }

        .graph-error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 250, 242, 0.98);
            border-radius: 12px;
            padding: 18px 28px;
            box-shadow: 0 10px 30px rgba(67, 48, 37, 0.25);
            border: 1px solid rgba(150, 90, 60, 0.2);
            color: #7a3b1d;
            max-width: 80%;
            line-height: 1.6;
            font-size: 16px;
            text-align: center;
            z-index: 500;
        }
        
        #knowledge-graph {
            width: 100%;
            height: 100%;
        }

        #graph-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #graph-3d canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .graph-3d-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(31, 26, 24, 0.75);
            color: #f8f2e8;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            display: none;
            z-index: 450;
        }
        
        .search-box {
            margin-bottom: 35px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            border-color: #b85c38;
            outline: none;
        }
        
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 200;
        }
        
        .search-result-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        
        .search-result-item:hover {
            background-color: #f5f7fb;
        }
        
        .control-section {
            margin-bottom: 25px;
        }
        
        .control-section h3 {
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(184, 92, 56, 0.4);
            color: #7a3b1d;
        }
        
        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .filter-options label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        
        .filter-options input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .node-details {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 350px;
            background: rgba(255, 250, 242, 0.98);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(67, 48, 37, 0.25);
            border: 1px solid rgba(150, 90, 60, 0.15);
            display: none;
            max-height: 80%;
            overflow-y: auto;
            z-index: 100;
        }
        
        .node-details h2 {
            color: #7a3b1d;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(184, 92, 56, 0.4);
        }
        
        .node-details p {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .detail-section {
            margin-bottom: 20px;
        }
        
        .detail-section h4 {
            margin-bottom: 10px;
            color: #b85c38;
        }
        
        .related-nodes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .related-node {
            background: rgba(184, 92, 56, 0.15);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
            color: #7a3b1d;
        }

        .related-node:hover {
            background: rgba(184, 92, 56, 0.25);
        }
        
        .bio-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bio-item {
            background: #f4f6fb;
            padding: 10px 12px;
            border-radius: 8px;
            line-height: 1.6;
            color: #2c3e50;
        }

        .bio-empty {
            color: #777;
        }
        
        .close-details {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #777;
        }
        
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        
        .legend-star {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d62728;
        }
        
        .relation-legend {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .relation-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .relation-color {
            width: 20px;
            height: 4px;
        }
        
        .toolbar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
        
        .toolbar button {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            background: #4a86e8;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        
        .toolbar button:hover {
            background: #3a76d8;
        }
        
        .node {
            cursor: pointer;
            transition: filter 0.3s;
        }
        
        .node:hover {
            filter: brightness(1.2);
        }
        
        .node-text {
            font-size: 12px;
            pointer-events: none;
            font-weight: 500;
            text-shadow: 1px 1px 2px white;
        }
        
        .link {
            stroke-opacity: 0.6;
            stroke-width: 2;
        }
        
        .link-label {
            font-size: 11px;
            fill: #3a3a3a;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            paint-order: stroke fill;
            stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 3px;
        }
        
        .node.highlighted {
            stroke: #ffcc00;
            stroke-width: 3px;
            filter: brightness(1.3);
        }
        
        .node-text.highlighted {
            font-weight: bold;
            font-size: 14px;
            fill: #d9534f;
        }
        
        .star-node {
            cursor: pointer;
            transition: filter 0.3s;
        }
        
        .star-node:hover {
            filter: brightness(1.2);
        }
        
        .star-node.highlighted {
            stroke: #ffcc00;
            stroke-width: 3px;
            filter: brightness(1.3);
        }
        
        @media (max-width: 1000px) {
            .main-content {
                flex-direction: column;
            }
            
            .graph-container {
                min-width: 100%;
                height: 600px;
            }
            
            .node-details {
                width: 300px;
            }
        }
        
        @media (max-width: 768px) {
            .graph-container {
                height: 500px;
            }
            
            .control-panel {
                max-height: 400px;
            }
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .node-details {
                width: 250px;
                right: 10px;
            }
            
            .toolbar {
                bottom: 10px;
                left: 10px;
            }
            
            .toolbar button {
                width: 35px;
                height: 35px;
            }
            
            .graph-container {
                height: 450px;
            }
        }
        
        @media (max-width: 480px) {
            .graph-container {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>红楼梦人物关系知识图谱</h1>
            <p class="subtitle">梳理贾府及相关家族的血缘、婚姻与仆从网络</p>
        </header>
        
        <div class="main-content">
            <div class="control-panel">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索节点...">
                    <div class="search-results" id="search-results"></div>
                </div>
                
                <div class="control-section">
                    <h3>家族/角色筛选</h3>
                    <div class="filter-options" id="domain-filters">
                        <label><input type="checkbox" name="domain" value="root" checked> 总览节点</label>
                        <label><input type="checkbox" name="domain" value="family" checked> 家族分支</label>
                        <label><input type="checkbox" name="domain" value="ning" checked> 宁国府人物</label>
                        <label><input type="checkbox" name="domain" value="rong" checked> 荣国府人物</label>
                        <label><input type="checkbox" name="domain" value="wang" checked> 王家人物</label>
                        <label><input type="checkbox" name="domain" value="lin" checked> 林家人物</label>
                        <label><input type="checkbox" name="domain" value="shi" checked> 史家人物</label>
                        <label><input type="checkbox" name="domain" value="xue" checked> 薛家人物</label>
                        <label><input type="checkbox" name="domain" value="other" checked> 其他关联人物</label>
                    </div>
                </div>
                
                <div class="control-section">
                    <h3>关系类型筛选</h3>
                    <div class="filter-options" id="relation-filters">
                        <!-- 关系类型筛选将动态生成 -->
                    </div>
                </div>
                
                <div class="control-section">
                    <h3>图谱操作</h3>
                    <div class="filter-options" id="graph-controls">
                        <label><input type="checkbox" id="show-links" checked> 显示连接线</label>
                        <label><input type="checkbox" id="show-labels" checked> 显示标签</label>
                        <label><input type="checkbox" id="show-link-labels"> 显示关系标签</label>
                        <label><input type="checkbox" id="auto-layout" checked> 自动布局</label>
                    </div>
                </div>

                <div class="control-section">
                    <h3>视图模式</h3>
                    <div class="filter-options" id="view-switcher">
                        <label><input type="radio" name="graph-view" value="2d" checked> 二维布局</label>
                        <label><input type="radio" name="graph-view" value="3d"> 三维布局</label>
                    </div>
                </div>
                
                <div class="control-section">
                    <h3>节点图例</h3>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-star"><i class="fas fa-star"></i></div>
                            <span>总览节点</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #f4a261;"></div>
                            <span>家族分支</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #f77f00;"></div>
                            <span>宁国府人物</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #2a9d8f;"></div>
                            <span>荣国府人物</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #8ecae6;"></div>
                            <span>王家人物</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #6a4c93;"></div>
                            <span>林家人物</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #ffb703;"></div>
                            <span>史家人物</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #264653;"></div>
                            <span>薛家人物</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #adb5bd;"></div>
                            <span>其他关联人物</span>
                        </div>
                    </div>
                </div>
                
                <div class="control-section">
                    <h3>关系图例</h3>
                    <div class="relation-legend" id="relation-legend">
                        <!-- 关系图例将动态生成 -->
                    </div>
                </div>
            </div>
            
            <div class="graph-container">
                <svg id="knowledge-graph"></svg>
                <div id="graph-3d"></div>
                <div class="graph-3d-hint" id="graph-3d-hint">按住拖拽旋转 · 滚轮缩放 · 点击节点查看详情</div>
                <div class="toolbar">
                    <button id="zoom-in"><i class="fas fa-search-plus"></i></button>
                    <button id="zoom-out"><i class="fas fa-search-minus"></i></button>
                    <button id="reset-view"><i class="fas fa-sync-alt"></i></button>
                    <button id="center-graph"><i class="fas fa-expand"></i></button>
                </div>
                <div class="node-details">
                    <span class="close-details">&times;</span>
                    <h2 id="detail-title">节点标题</h2>
                    <div class="detail-section">
                        <h4>类型</h4>
                        <p id="detail-type">节点类型</p>
                    </div>
                    <div class="detail-section">
                        <h4>描述</h4>
                        <p id="detail-description">节点描述内容将显示在这里...</p>
                    </div>
                    <div class="detail-section">
                        <h4>相关节点</h4>
                        <div class="related-nodes" id="related-nodes">
                            <!-- 相关节点链接将在这里动态生成 -->
                        </div>
                    </div>
                    <div class="detail-section">
                        <h4>人物小传</h4>
                        <div class="bio-list" id="bio-list">
                            <!-- 人物介绍将在这里动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        const LINK_LABEL_BASE_OFFSET = 12;
        const LINK_LABEL_SEPARATION = 16;
        const LINK_LABEL_ALONG_OFFSET = 6;

        function prepareLinkLabelOffsets(links) {
            const groupedLinks = new Map();

            links.forEach(link => {
                const sourceId = typeof link.source === 'object' ? link.source.id : link.source;
                const targetId = typeof link.target === 'object' ? link.target.id : link.target;
                const key = sourceId <= targetId ? `${sourceId}-${targetId}` : `${targetId}-${sourceId}`;

                if (!groupedLinks.has(key)) {
                    groupedLinks.set(key, []);
                }
                groupedLinks.get(key).push(link);
            });

            groupedLinks.forEach(group => {
                group.forEach((link, index) => {
                    link.labelIndex = index;
                    link.labelCount = group.length;
                });
            });
        }

        function calculateLinkLabelPosition(link) {
            const sourceX = link.source.x !== undefined ? link.source.x : 0;
            const sourceY = link.source.y !== undefined ? link.source.y : 0;
            const targetX = link.target.x !== undefined ? link.target.x : 0;
            const targetY = link.target.y !== undefined ? link.target.y : 0;

            const midX = (sourceX + targetX) / 2;
            const midY = (sourceY + targetY) / 2;

            const dx = targetX - sourceX;
            const dy = targetY - sourceY;
            const distance = Math.sqrt(dx * dx + dy * dy) || 1;

            const perpendicularX = -dy / distance;
            const perpendicularY = dx / distance;
            const directionX = dx / distance;
            const directionY = dy / distance;

            const groupSize = link.labelCount || 1;
            const indexOffset = link.labelIndex !== undefined ? (link.labelIndex - (groupSize - 1) / 2) : 0;

            const baseOffsetX = perpendicularX * LINK_LABEL_BASE_OFFSET;
            const baseOffsetY = perpendicularY * LINK_LABEL_BASE_OFFSET;
            const multiOffsetX = perpendicularX * LINK_LABEL_SEPARATION * indexOffset;
            const multiOffsetY = perpendicularY * LINK_LABEL_SEPARATION * indexOffset;
            const alongOffsetX = directionX * LINK_LABEL_ALONG_OFFSET;
            const alongOffsetY = directionY * LINK_LABEL_ALONG_OFFSET;

            return {
                x: midX + baseOffsetX + multiOffsetX + alongOffsetX,
                y: midY + baseOffsetY + multiOffsetY + alongOffsetY
            };
        }

        function create3DRenderer(container, options = {}) {
            const canvas = document.createElement('canvas');
            canvas.id = 'graph-3d-canvas';
            container.innerHTML = '';
            container.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            const defaultRotationX = -0.35;
            const defaultRotationY = 0.55;
            const baseLayoutConfig = {
                repulsionStrength: 2400,
                linkDistance: 160,
                linkStrength: 0.015,
                centeringStrength: 0.0045,
                layeringStrength: 0.018,
                damping: 0.86
            };
            const depthMap = options.layerDepthMap || {
                root: -40,
                family: -140,
                ning: -240,
                rong: -320,
                wang: -400,
                lin: -480,
                shi: -560,
                xue: -640,
                other: -720
            };

            const state = {
                width: container.clientWidth || 800,
                height: container.clientHeight || 600,
                nodes: [],
                links: [],
                projectedNodes: [],
                basePositions: new Map(),
                nodeLookup: new Map(),
                rotationX: defaultRotationX,
                rotationY: defaultRotationY,
                targetRotationX: defaultRotationX,
                targetRotationY: defaultRotationY,
                scale: 0.9,
                targetScale: 0.9,
                cameraDistance: 900,
                offsetX: 0,
                offsetY: 0,
                targetOffsetX: 0,
                targetOffsetY: 0,
                highlightId: null,
                searchHighlights: new Set(),
                autoRotate: true,
                autoRotateSpeed: 0.0008,
                needsRedraw: true,
                showLinks: true,
                showLabels: true,
                showLinkLabels: false,
                autoLayoutEnabled: true,
                layoutConfig: {
                    ...baseLayoutConfig,
                    ...(options.layoutConfig || {})
                },
                pointerActive: false,
                pointerMoved: false,
                pointerMode: 'rotate',
                pointerLastX: 0,
                pointerLastY: 0,
                onNodeClick: options.onNodeClick || (() => {}),
                getNodeColor: options.getNodeColor || (() => '#adb5bd'),
                getLinkColor: options.getLinkColor || (() => '#999'),
                getNodeLabel: options.getNodeLabel || (node => node.name),
                autoRotateDelay: options.autoRotateDelay || 7000,
                autoRotateTimer: null,
                animationFrameId: null

            function resize(width, height) {
                state.width = Math.max(width, 200);
                state.height = Math.max(height, 200);

                canvas.width = state.width * ratio;
                canvas.height = state.height * ratio;

                canvas.style.height = `${state.height}px`;

                } else {

            function scheduleAutoRotate() {

            function ensureBasePosition(node) {
                if (state.basePositions.has(node.id)) {
                    return state.basePositions.get(node.id);
                }

                const cached = lastNodePositions[node.id];
                const fallbackX = (Math.random() - 0.5) * 700;
                const fallbackY = (Math.random() - 0.5) * 700;
                const depth = depthMap[node.type] !== undefined ? depthMap[node.type] : -680;
                const basePosition = {
                    x: (cached ? cached.x : fallbackX) * 1.05,
                    y: (cached ? cached.y : fallbackY) * 1.05,
                    z: depth + (Math.random() - 0.5) * 70

            function setData(nodes, links) {
                state.nodeLookup.clear();
                state.nodes = nodes.map(node => {
                    const base = ensureBasePosition(node);
                    const positioned = {
                        ...node,
                        baseX: base.x,
                        baseY: base.y,
                        baseZ: base.z,
                        x: base.x,
                        y: base.y,
                        z: base.z,
                        vx: 0,
                        vy: 0,
                        vz: 0,
                        fx: 0,
                        fy: 0,
                        fz: 0
                    };
                    state.nodeLookup.set(node.id, positioned);
                    return positioned;

                state.links = [];
                links.forEach(link => {
                    const sourceId = link.source;
                    const targetId = link.target;
                    if (!state.nodeLookup.has(sourceId) || !state.nodeLookup.has(targetId)) {

                    state.links.push({
                        source: sourceId,
                        target: targetId,
                        type: link.type,
                        relation: link.relation || link.type

            function setCurrentNode(nodeId) {

            function setSearchHighlights(highlights) {

            function refreshStyles() {

            function focusNode(nodeId) {
                const node = state.nodeLookup.get(nodeId);
                if (!node) return;

                const depth = node.z === 0 ? -1 : -node.z;
                const angleY = Math.atan2(node.x, depth);
                const angleX = Math.atan2(node.y, depth);

                state.targetRotationY = angleY;
                state.targetRotationX = -angleX;
                state.targetScale = Math.max(state.targetScale, 1.45);
                const cosY = Math.cos(state.targetRotationY);
                const sinY = Math.sin(state.targetRotationY);
                const cosX = Math.cos(state.targetRotationX);
                const sinX = Math.sin(state.targetRotationX);

                let x1 = node.x * cosY - node.z * sinY;
                let z1 = node.x * sinY + node.z * cosY;
                let y1 = node.y * cosX - z1 * sinX;
                z1 = node.y * sinX + z1 * cosX;

                const denom = state.cameraDistance - z1;
                if (denom > 30) {
                    const perspective = state.cameraDistance / denom;
                    const previewScale = Math.max(state.targetScale, state.scale) * perspective * 0.7;
                    state.targetOffsetX = -x1 * previewScale;
                    state.targetOffsetY = -y1 * previewScale;
                }

                state.highlightId = nodeId;
                state.autoRotate = false;
                scheduleAutoRotate();
                state.needsRedraw = true;
            }

            function resetView() {
                state.targetRotationX = defaultRotationX;
                state.targetRotationY = defaultRotationY;

                state.targetOffsetX = 0;

            function setNodeColorGetter(fn) {

            function setShowLinks(show) {

            function setShowLabels(show) {

            function setAutoLayoutEnabled(enabled) {
                const value = Boolean(enabled);
                if (state.autoLayoutEnabled === value) {
                    return;
                }

                state.autoLayoutEnabled = value;
                state.nodes.forEach(node => {
                    node.vx = 0;
                    node.vy = 0;
                    node.vz = 0;

            function zoomBy(factor) {
                if (typeof factor !== 'number' || !isFinite(factor)) {
                    return;
                }
                stopAutoRotate();
                state.targetScale = Math.min(2.5, Math.max(0.35, state.targetScale * factor));
                state.needsRedraw = true;
                scheduleAutoRotate();
