            function handleClick(event) {
                const rect = canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                let closest = null;
                let closestDistance = Infinity;

                state.projectedNodes.forEach(item => {
                    const dx = item.x - x;
                    const dy = item.y - y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < closestDistance && distance <= item.radius + 8) {
                        closest = item;
                        closestDistance = distance;
                    }
                });

                if (closest) {
                    state.onNodeClick(closest.node);
                }
            }

            function stepAutoLayout() {
                if (!state.autoLayoutEnabled || state.nodes.length === 0) {
                    return false;
                }

                const {
                    repulsionStrength,
                    linkDistance,
                    linkStrength,
                    centeringStrength,
                    layeringStrength,
                    damping
                } = state.layoutConfig;

                const nodes = state.nodes;
                const nodeCount = nodes.length;

                for (let i = 0; i < nodeCount; i++) {
                    const node = nodes[i];
                    node.fx = 0;
                    node.fy = 0;
                    node.fz = 0;
                }

                for (let i = 0; i < nodeCount; i++) {
                    const nodeA = nodes[i];
                    for (let j = i + 1; j < nodeCount; j++) {
                        const nodeB = nodes[j];
                        let dx = nodeA.x - nodeB.x;
                        let dy = nodeA.y - nodeB.y;
                        let dz = nodeA.z - nodeB.z;
                        const distanceSq = dx * dx + dy * dy + dz * dz + 0.01;
                        const force = repulsionStrength / distanceSq;
                        const distance = Math.sqrt(distanceSq);
                        dx /= distance;
                        dy /= distance;
                        dz /= distance;
                        nodeA.fx += dx * force;
                        nodeA.fy += dy * force;
                        nodeA.fz += dz * force;
                        nodeB.fx -= dx * force;
                        nodeB.fy -= dy * force;
                        nodeB.fz -= dz * force;
                    }
                }

                state.links.forEach(link => {
                    const source = state.nodeLookup.get(link.source);
                    const target = state.nodeLookup.get(link.target);
                    if (!source || !target) return;
                    let dx = target.x - source.x;
                    let dy = target.y - source.y;
                    let dz = target.z - source.z;
                    const distance = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.0001;
                    const delta = distance - linkDistance;
                    const force = delta * linkStrength;
                    dx /= distance;
                    dy /= distance;
                    dz /= distance;
                    source.fx += dx * force;
                    source.fy += dy * force;
                    source.fz += dz * force;
                    target.fx -= dx * force;
                    target.fy -= dy * force;
                    target.fz -= dz * force;
                });

                let moved = false;
                for (let i = 0; i < nodeCount; i++) {
                    const node = nodes[i];
                    node.fx += -node.x * centeringStrength;
                    node.fy += -node.y * centeringStrength;
                    node.fz += (node.baseZ - node.z) * layeringStrength;

                    node.vx = (node.vx + node.fx) * damping;
                    node.vy = (node.vy + node.fy) * damping;
                    node.vz = (node.vz + node.fz) * damping;

                    const speedSq = node.vx * node.vx + node.vy * node.vy + node.vz * node.vz;
                    if (speedSq > 0.00005) {
                        moved = true;
                    }

                    node.x += node.vx;
                    node.y += node.vy;
                    node.z += node.vz;

                    state.basePositions.set(node.id, { x: node.x, y: node.y, z: node.z });
                }

                return moved;
            }

            function renderFrame() {
                state.animationFrameId = requestAnimationFrame(renderFrame);

                if (state.autoRotate) {
                    state.rotationY += state.autoRotateSpeed;
                    state.targetRotationY = state.rotationY;
                } else {
                    state.rotationY += (state.targetRotationY - state.rotationY) * 0.08;
                }
                state.rotationX += (state.targetRotationX - state.rotationX) * 0.08;
                state.scale += (state.targetScale - state.scale) * 0.08;
                state.offsetX += (state.targetOffsetX - state.offsetX) * 0.12;
                state.offsetY += (state.targetOffsetY - state.offsetY) * 0.12;

                const layoutChanged = stepAutoLayout();

                if (!state.needsRedraw && !layoutChanged &&
                    Math.abs(state.rotationX - state.targetRotationX) < 0.0005 &&
                    Math.abs(state.rotationY - state.targetRotationY) < 0.0005 &&
                    Math.abs(state.scale - state.targetScale) < 0.0005 &&
                    Math.abs(state.offsetX - state.targetOffsetX) < 0.3 &&
                    Math.abs(state.offsetY - state.targetOffsetY) < 0.3) {
                    return;
                }

                state.needsRedraw = false;

                ctx.clearRect(0, 0, state.width, state.height);

                const cosY = Math.cos(state.rotationY);
                const sinY = Math.sin(state.rotationY);
                const cosX = Math.cos(state.rotationX);
                const sinX = Math.sin(state.rotationX);
                const widthHalf = state.width / 2;
                const heightHalf = state.height / 2;

                const projected = [];

                state.nodes.forEach(node => {
                    const x = node.x;
                    const y = node.y;
                    const z = node.z;

                    let x1 = x * cosY - z * sinY;
                    let z1 = x * sinY + z * cosY;
                    let y1 = y * cosX - z1 * sinX;
                    z1 = y * sinX + z1 * cosX;

                    const denom = state.cameraDistance - z1;
                    if (denom < 30) {
                        return;
                    }

                    const perspective = state.cameraDistance / denom;
                    const screenScale = state.scale * perspective * 0.7;
                    const screenX = x1 * screenScale + widthHalf + state.offsetX;
                    const screenY = y1 * screenScale + heightHalf + state.offsetY;
                    const baseRadius = Math.max(3.2, 6 * screenScale);
                    const radius = baseRadius * (node.id === state.highlightId ? 1.5 : (state.searchHighlights.has(node.id) ? 1.25 : 1));

                    projected.push({
                        node,
                        x: screenX,
                        y: screenY,
                        radius,
                        depth: z1,
                        perspective
                    });
                });

                state.projectedNodes = projected;

                const projectedMap = new Map(projected.map(item => [item.node.id, item]));

                if (state.showLinks || state.showLinkLabels) {
                    const linkOpacity = state.showLinks ? 0.65 : 0;
                    if (state.showLinks) {
                        ctx.save();
                        ctx.globalAlpha = linkOpacity;
                        state.links.forEach(link => {
                            const source = projectedMap.get(link.source);
                            const target = projectedMap.get(link.target);
                            if (!source || !target) return;
                            ctx.strokeStyle = state.getLinkColor(link);
                            ctx.lineWidth = Math.max(0.6, 1.1 * Math.min(source.perspective, target.perspective));
                            ctx.beginPath();
                            ctx.moveTo(source.x, source.y);
                            ctx.lineTo(target.x, target.y);
                            ctx.stroke();
                        });
                        ctx.restore();
                    }

                    if (state.showLinkLabels) {
                        ctx.save();
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        state.links.forEach(link => {
                            const source = projectedMap.get(link.source);
                            const target = projectedMap.get(link.target);
                            if (!source || !target) return;
                            const midX = (source.x + target.x) / 2;
                            const midY = (source.y + target.y) / 2;
                            const depthFactor = Math.min(source.perspective, target.perspective);
                            const fontSize = Math.max(10, Math.min(16, 11 + depthFactor * 4));
                            ctx.font = `${fontSize}px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif`;
                            const label = link.relation || link.type || '';
                            if (!label) return;
                            const metrics = ctx.measureText(label);
                            const paddingX = 6;
                            const paddingY = 4;
                            const boxWidth = metrics.width + paddingX * 2;
                            const boxHeight = fontSize + paddingY * 2;
                            const boxX = midX - boxWidth / 2;
                            const boxY = midY - boxHeight / 2;

                            ctx.fillStyle = `rgba(255, 250, 242, ${0.5 + depthFactor * 0.35})`;
                            ctx.strokeStyle = `rgba(122, 59, 29, ${0.25 + depthFactor * 0.25})`;
                            ctx.lineWidth = 0.8;
                            ctx.beginPath();
                            ctx.rect(boxX, boxY, boxWidth, boxHeight);
                            ctx.fill();
                            ctx.stroke();

                            ctx.fillStyle = 'rgba(61, 40, 30, 0.9)';
                            ctx.fillText(label, midX, midY + 1);
                        });
                        ctx.restore();
                    }
                }

                const sortedNodes = projected.slice().sort((a, b) => a.depth - b.depth);

                sortedNodes.forEach(item => {
                    const { node } = item;
                    ctx.beginPath();
                    ctx.fillStyle = state.getNodeColor(node);
                    ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                    ctx.fill();

                    if (node.id === state.highlightId) {
                        ctx.lineWidth = 2.5;
                        ctx.strokeStyle = '#ffcc00';
                        ctx.stroke();
                    } else if (state.searchHighlights.has(node.id)) {
                        ctx.lineWidth = 1.6;
                        ctx.strokeStyle = '#ff8c00';
                        ctx.stroke();
                    } else {
                        ctx.lineWidth = 0.8;
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
                        ctx.stroke();
                    }

                    const isHighlighted = node.id === state.highlightId || state.searchHighlights.has(node.id);
                    const shouldShowLabel = isHighlighted || (state.showLabels && item.perspective > 0.55);
                    if (shouldShowLabel) {
                        ctx.fillStyle = 'rgba(30, 27, 25, 0.85)';
                        ctx.font = `${Math.max(11, Math.min(18, 12 * item.perspective + 2))}px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText(state.getNodeLabel(node), item.x, item.y - item.radius - 6);
                    }
                });
            }

            function handlePointerDown(event) {
                stopAutoRotate();
                state.pointerActive = true;
                state.pointerMoved = false;
                const isPanGesture = event.button === 1 || event.button === 2 || event.ctrlKey || event.metaKey || event.shiftKey;
                state.pointerMode = isPanGesture ? 'pan' : 'rotate';
                state.pointerLastX = event.clientX;
                state.pointerLastY = event.clientY;
                if (isPanGesture) {
                    event.preventDefault();
                }
                canvas.style.cursor = state.pointerMode === 'pan' ? 'move' : 'grabbing';
                if (canvas.setPointerCapture) {
                    canvas.setPointerCapture(event.pointerId);
                }
            }

            function handlePointerMove(event) {
                if (!state.pointerActive) return;
                const dx = event.clientX - state.pointerLastX;
                const dy = event.clientY - state.pointerLastY;
                if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                    state.pointerMoved = true;
                }

                if (state.pointerMode === 'pan') {
                    state.offsetX += dx;
                    state.offsetY += dy;
                    state.targetOffsetX = state.offsetX;
                    state.targetOffsetY = state.offsetY;
                } else {
                    state.rotationY += dx * 0.005;
                    state.rotationX += dy * 0.005;
                    state.rotationX = Math.max(-1.2, Math.min(1.2, state.rotationX));
                    state.targetRotationY = state.rotationY;
                    state.targetRotationX = state.rotationX;
                }

                state.pointerLastX = event.clientX;
                state.pointerLastY = event.clientY;
                state.needsRedraw = true;
            }

            function handlePointerUp(event) {
                if (!state.pointerActive) return;
                if (canvas.hasPointerCapture && canvas.hasPointerCapture(event.pointerId)) {
                    canvas.releasePointerCapture(event.pointerId);
                }
                state.pointerActive = false;
                const wasRotate = state.pointerMode === 'rotate';
                const isPointerUpEvent = event.type === 'pointerup';
                state.pointerMode = 'rotate';
                canvas.style.cursor = 'grab';
                scheduleAutoRotate();
                if (isPointerUpEvent && wasRotate && !state.pointerMoved) {
                    handleClick(event);
                }
                state.pointerMoved = false;
            }

            function handleWheel(event) {
                event.preventDefault();
                stopAutoRotate();
                const scaleFactor = event.deltaY > 0 ? 0.9 : 1.1;
                state.targetScale = Math.min(2.2, Math.max(0.45, state.targetScale * scaleFactor));
                state.needsRedraw = true;
                scheduleAutoRotate();
            }

            canvas.addEventListener('pointerdown', handlePointerDown);
            canvas.addEventListener('pointermove', handlePointerMove);
            canvas.addEventListener('pointerup', handlePointerUp);
            canvas.addEventListener('pointercancel', handlePointerUp);
            canvas.addEventListener('pointerleave', handlePointerUp);
            canvas.addEventListener('contextmenu', event => event.preventDefault());
            canvas.addEventListener('wheel', handleWheel, { passive: false });
            canvas.style.cursor = 'grab';

            resize(state.width, state.height);
            scheduleAutoRotate();
            renderFrame();

            return {
                resize,
                setData,
                setCurrentNode,
                setSearchHighlights,
                refreshStyles,
                focusNode,
                resetView,
                setNodeColorGetter,
                setLinkColorGetter,
                setShowLinks,
                setShowLabels,
                setShowLinkLabels,
                setAutoLayoutEnabled,
                zoomBy,
                stopAutoRotate,
                scheduleAutoRotate,
                destroy() {
                    if (state.animationFrameId) {
                        cancelAnimationFrame(state.animationFrameId);
                    }
                    if (state.autoRotateTimer) {
                        clearTimeout(state.autoRotateTimer);
                    }
                }
            };
        }

        function showGraphError(message) {
            const container = document.querySelector('.graph-container');
            if (!container) return;
            let errorNode = container.querySelector('.graph-error');
            if (!errorNode) {
                errorNode = document.createElement('div');
                errorNode.className = 'graph-error';
                container.appendChild(errorNode);
            }
            errorNode.textContent = message;
        }

        function clearGraphError() {
            const container = document.querySelector('.graph-container');
            if (!container) return;
            const errorNode = container.querySelector('.graph-error');
            if (errorNode) {
                errorNode.remove();
            }
        }

        function show3DHintOverlay() {
            const hint = document.getElementById('graph-3d-hint');
            if (!hint) return;
            hint.style.display = 'block';
            if (graph3DHintTimer) {
                clearTimeout(graph3DHintTimer);
            }
            graph3DHintTimer = setTimeout(() => {
                hint.style.display = 'none';
                graph3DHintTimer = null;
            }, 5000);
        }

        function hide3DHintOverlay() {
            const hint = document.getElementById('graph-3d-hint');
            if (!hint) return;
            hint.style.display = 'none';
            if (graph3DHintTimer) {
                clearTimeout(graph3DHintTimer);
                graph3DHintTimer = null;
            }
        }

        function getNodeId(nodeRef) {
            return typeof nodeRef === 'object' ? nodeRef.id : nodeRef;
        }

        function getNodeData(nodeRef) {
            const id = getNodeId(nodeRef);
            return graphData.nodes.find(node => node.id === id) || rawNodeMap.get(id);
        }

        function getNodeType(nodeRef) {
            const nodeData = getNodeData(nodeRef);
            return nodeData ? nodeData.type : null;
        }

        function get3DNodeColor(node) {
            if (currentNode && node.id === currentNode.id) {
                return '#ffcc00';
            }
            if (searchHighlightIds.has(node.id)) {
                return '#ff8c00';
            }
            return colorMap[node.type] || '#adb5bd';
        }

        // 类型名称映射
        const typeNames = {
            "root": "总览节点",
            "family": "家族分支",
            "ning": "宁国府人物",
            "rong": "荣国府人物",
            "wang": "王家人物",
            "lin": "林家人物",
            "shi": "史家人物",
            "xue": "薛家人物",
            "other": "其他关联人物"
        };

        // 全局变量
        let simulation, zoom, g, node, link, text, linkLabels, svg;
        let currentTransform = d3.zoomIdentity;
        let lastNodePositions = {};
        let currentNode = null;
        let relationTypes = new Set();
        let graph3DRenderer = null;
        let controlsInitialized = false;
        let relationFiltersInitialized = false;
        let currentView = '2d';
        let searchHighlightIds = new Set();
        let activeDomains = Array.from(new Set(rawGraphData.nodes.map(node => node.type)));
        let activeRelations = Array.from(new Set(rawGraphData.links.map(link => link.type)));
        let graph3DHintTimer = null;

        function getGraphContainerSize() {
            const container = document.querySelector('.graph-container');
            if (!container) {
                const fallbackWidth = window.innerWidth || document.documentElement.clientWidth || 1280;
                const fallbackHeight = window.innerHeight || document.documentElement.clientHeight || 720;
                return {
                    width: fallbackWidth,
                    height: fallbackHeight
                };
            }

            const rect = container.getBoundingClientRect();
            const width = Math.max(rect.width, container.clientWidth, 600);
            const height = Math.max(rect.height, container.clientHeight, 400);

            return { width, height };
        }

        // 初始化图谱
        function init2DGraph() {
            if (currentView !== '2d') {
                return;
            }
            const { width, height } = getGraphContainerSize();
            const svgElement = document.getElementById('knowledge-graph');
            if (!svgElement) {
                return;
            }

            clearGraphError();

            // 清除之前的SVG内容
            d3.select('#knowledge-graph').selectAll('*').remove();

            prepareLinkLabelOffsets(graphData.links);

            if (!relationFiltersInitialized) {
                initRelationFilters();
                relationFiltersInitialized = true;
            }

            // 创建SVG元素
            svg = d3.select('#knowledge-graph')
                .attr('width', width)
                .attr('height', height)
                .style('width', `${width}px`)
                .style('height', `${height}px`);
                
            // 添加缩放和平移支持
            zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    currentTransform = event.transform;
                    g.attr('transform', event.transform);
                });
                
            svg.call(zoom);
            
            // 创建容器
            g = svg.append('g');
            
            // 创建力导向图模拟 - 为根节点设置更强的中心力
            simulation = d3.forceSimulation(graphData.nodes)
                .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(d => d.id === 0 ? -1000 : -300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(50));
            
            // 绘制连接线
            link = g.append('g')
                .attr('class', 'links')
                .selectAll('line')
                .data(graphData.links)
                .enter().append('line')
                .attr('class', 'link')
                .attr('stroke', d => relationColorMap[d.type] || '#999')
                .attr('stroke-width', 2);
            
            // 添加连线标签
            linkLabels = g.append('g')
                .attr('class', 'link-labels')
                .selectAll('text')
                .data(graphData.links)
                .enter().append('text')
                .attr('class', 'link-label')
                .text(d => d.relation)
                .style('display', 'none');
            
            // 绘制所有节点 - 根据类型使用不同图形
            node = g.append('g')
                .attr('class', 'nodes')
                .selectAll('path')
                .data(graphData.nodes)
                .enter().append('path')
                .attr('class', d => d.id === 0 ? 'star-node' : 'node')
                .attr('d', d => {
                    const size = d.id === 0 ? 400 : 150;
                    switch(nodeShapeMap[d.type]) {
                        case 'star': return d3.symbol().type(d3.symbolStar).size(size)();
                        case 'square': return d3.symbol().type(d3.symbolSquare).size(size)();
                        case 'triangle': return d3.symbol().type(d3.symbolTriangle).size(size)();
                        case 'diamond': return d3.symbol().type(d3.symbolDiamond).size(size)();
                        case 'cross': return d3.symbol().type(d3.symbolCross).size(size)();
                        default: return d3.symbol().type(d3.symbolCircle).size(size)();
                    }
                })
                .attr('fill', d => colorMap[d.type])
                .attr('stroke', 'none') // 移除所有图形的黑边
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended))
                .on('click', showNodeDetails);
            
            // 添加节点标签 - 根节点设置更大字体
            text = g.append('g')
                .attr('class', 'labels')
                .selectAll('text')
                .data(graphData.nodes)
                .enter().append('text')
                .attr('class', 'node-text')
                .text(d => d.name)
                .attr('text-anchor', 'middle')
                .attr('dy', d => d.id === 0 ? -25 : -12) // 根节点标签位置调整
                .style('font-size', d => d.id === 0 ? '14px' : '12px') // 根节点字体更大
                .style('font-weight', d => d.id === 0 ? 'bold' : '500'); // 根节点字体加粗
            
            // 更新力导向图 - 确保节点和标签同步移动
            simulation.on('tick', () => {
                // 保存节点位置
                graphData.nodes.forEach(n => {
                    lastNodePositions[n.id] = { x: n.x, y: n.y };
                });
                
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                linkLabels
                    .each(function(d) {
                        const position = calculateLinkLabelPosition(d);
                        d._labelX = position.x;
                        d._labelY = position.y;
                    })
                    .attr('x', d => d._labelX)
                    .attr('y', d => d._labelY);
                
                // 所有节点使用transform定位，确保同步移动
                node
                    .attr('transform', d => `translate(${d.x},${d.y})`);
                
                text
                    .attr('x', d => d.x)
                    .attr('y', d => d.y);
            });
            
            if (!controlsInitialized) {
                const searchInput = document.getElementById('search-input');
                const searchResults = document.getElementById('search-results');

                // 工具栏功能
                document.getElementById('zoom-in').addEventListener('click', () => {
                    if (currentView === '2d' && svg) {
                        svg.transition().duration(500).call(zoom.scaleBy, 1.5);
                    } else if (currentView === '3d' && graph3DRenderer) {
                        graph3DRenderer.zoomBy(1.25);
                    }
                });

                document.getElementById('zoom-out').addEventListener('click', () => {
                    if (currentView === '2d' && svg) {
                        svg.transition().duration(500).call(zoom.scaleBy, 0.75);
                    } else if (currentView === '3d' && graph3DRenderer) {
                        graph3DRenderer.zoomBy(0.8);
                    }
                });

                document.getElementById('reset-view').addEventListener('click', () => {
                    if (currentView === '2d' && svg) {
                        svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
                    } else if (currentView === '3d' && graph3DRenderer) {
                        graph3DRenderer.resetView();
                    }
                    resetNodeStyles();
                    if (graph3DRenderer) {
                        graph3DRenderer.setCurrentNode(currentNode ? currentNode.id : null);
                        graph3DRenderer.refreshStyles();
                    }
                });

                document.getElementById('center-graph').addEventListener('click', () => {
                    if (currentView === '2d' && svg) {
                        const bounds = document.getElementById('knowledge-graph').getBBox();
                        const parent = document.getElementById('knowledge-graph').parentElement;
                        const fullWidth = parent.clientWidth;
                        const fullHeight = parent.clientHeight;
                        const width = bounds.width;
                        const height = bounds.height;
                        const midX = bounds.x + width / 2;
                        const midY = bounds.y + height / 2;

                        if (width === 0 || height === 0) return;

                        const scale = 0.85 / Math.max(width / fullWidth, height / fullHeight);
                        const translate = [
                            fullWidth / 2 - scale * midX,
                            fullHeight / 2 - scale * midY
                        ];

                        svg.transition().duration(500).call(
                            zoom.transform,
                            d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
                        );
                    } else if (currentView === '3d' && graph3DRenderer) {
                        graph3DRenderer.resetView();
                    }
                });

                // 关闭详情面板
                document.querySelector('.close-details').addEventListener('click', () => {
                    document.querySelector('.node-details').style.display = 'none';
                    currentNode = null;
                    resetNodeStyles();
                });

                // 搜索功能
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase();
                    searchResults.innerHTML = '';

                    if (searchTerm.length === 0) {
                        searchResults.style.display = 'none';
                        resetNodeStyles();
                        searchHighlightIds = new Set();
                        if (graph3DRenderer) {
                            graph3DRenderer.setSearchHighlights(searchHighlightIds);
                            graph3DRenderer.refreshStyles();
                        }
                        return;
                    }

                    const foundNodes = graphData.nodes.filter(n =>
                        n.name.toLowerCase().includes(searchTerm) ||
                        n.description.toLowerCase().includes(searchTerm)
                    );

                    if (foundNodes.length > 0) {
                        searchResults.style.display = 'block';
                        foundNodes.forEach(n => {
                            const resultItem = document.createElement('div');
                            resultItem.className = 'search-result-item';
                            resultItem.textContent = n.name;
                            resultItem.setAttribute('data-node-id', n.id);
                            resultItem.addEventListener('click', () => {
                                searchInput.value = '';
                                searchResults.style.display = 'none';
                                focusOnNode(n.id);
                            });
                            searchResults.appendChild(resultItem);
                        });
                    } else {
                        searchResults.style.display = 'none';
                    }

                    // 高亮匹配节点
                    resetNodeStyles();
                    searchHighlightIds = new Set(foundNodes.map(n => n.id));
                    if (node) {
                        node.filter(d => foundNodes.some(n => n.id === d.id))
                            .classed('highlighted', true);
                    }
                    if (text) {
                        text.filter(d => foundNodes.some(n => n.id === d.id))
                            .classed('highlighted', true);
                    }
                    if (graph3DRenderer) {
                        graph3DRenderer.setSearchHighlights(searchHighlightIds);
                        graph3DRenderer.refreshStyles();
                    }
                });

                // 点击其他地方关闭搜索结果
                document.addEventListener('click', (e) => {
                    if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                        searchResults.style.display = 'none';
                    }
                });

                // 知识领域筛选
                document.querySelectorAll('#domain-filters input').forEach(filter => {
                    filter.addEventListener('change', applyFilters);
                });

                // 关系类型筛选
                document.querySelectorAll('#relation-filters input').forEach(filter => {
                    filter.addEventListener('change', applyFilters);
                });

                // 图谱操作
                document.getElementById('show-links').addEventListener('change', applyFilters);
                document.getElementById('show-labels').addEventListener('change', applyFilters);
                document.getElementById('show-link-labels').addEventListener('change', applyFilters);

                document.getElementById('auto-layout').addEventListener('change', function() {
                    if (this.checked) {
                        simulation.alphaTarget(0.3).restart();
                    } else {
                        simulation.alphaTarget(0.001);
                    }
                    if (graph3DRenderer) {
                        graph3DRenderer.setAutoLayoutEnabled(this.checked);
                    }
                });

                document.querySelectorAll('input[name="graph-view"]').forEach(radio => {
                    radio.addEventListener('change', (event) => {
                        if (!event.target.checked) return;
                        switchGraphView(event.target.value);
                    });
                });

                controlsInitialized = true;
            }

            applyFilters();

            const detailsPanelVisible = document.querySelector('.node-details').style.display !== 'none';
            if (currentNode && detailsPanelVisible) {
                showNodeDetails(null, currentNode);
            }
        }
        
        // 初始化关系类型筛选
        function initRelationFilters() {
            const relationFiltersContainer = document.getElementById('relation-filters');
            const relationLegendContainer = document.getElementById('relation-legend');
            
            // 收集所有关系类型
            graphData.links.forEach(link => {
                relationTypes.add(link.type);
            });
            
            // 创建筛选器和图例
            relationTypes.forEach(type => {
                // 筛选器
                const filterItem = document.createElement('label');
                filterItem.innerHTML = `<input type="checkbox" name="relation" value="${type}" checked> ${type}`;
                relationFiltersContainer.appendChild(filterItem);
                
                // 图例
                const legendItem = document.createElement('div');
                legendItem.className = 'relation-item';
                legendItem.innerHTML = `
                    <div class="relation-color" style="background-color: ${relationColorMap[type] || '#999'}"></div>
                    <span>${type}</span>
                `;
                relationLegendContainer.appendChild(legendItem);
            });
        }
        
        // 应用筛选条件
        function applyFilters() {
            const selectedDomains = Array.from(document.querySelectorAll('#domain-filters input:checked'))
                .map(input => input.value);

            const selectedRelations = Array.from(document.querySelectorAll('#relation-filters input:checked'))
                .map(input => input.value);

            activeDomains = selectedDomains;
            activeRelations = selectedRelations;

            const showLinks = document.getElementById('show-links').checked;
            const showLabels = document.getElementById('show-labels').checked;
            const showLinkLabels = document.getElementById('show-link-labels').checked;

            if (node) {
                node.style('display', d => selectedDomains.includes(d.type) ? 'block' : 'none');
            }

            if (text) {
                text.style('display', d => (selectedDomains.includes(d.type) && showLabels) ? 'block' : 'none');
            }

            if (link) {
                link.style('display', d => {
                    if (!showLinks) return 'none';
                    const sourceType = getNodeType(d.source);
                    const targetType = getNodeType(d.target);
                    const relationVisible = selectedRelations.includes(d.type);
                    const sourceVisible = sourceType ? selectedDomains.includes(sourceType) : false;
                    const targetVisible = targetType ? selectedDomains.includes(targetType) : false;
                    return sourceVisible && targetVisible && relationVisible ? 'block' : 'none';
                });
            }

            if (linkLabels) {
                linkLabels.style('display', d => {
                    if (!showLinkLabels) return 'none';
                    const sourceType = getNodeType(d.source);
                    const targetType = getNodeType(d.target);
                    const relationVisible = selectedRelations.includes(d.type);
                    const sourceVisible = sourceType ? selectedDomains.includes(sourceType) : false;
                    const targetVisible = targetType ? selectedDomains.includes(targetType) : false;
                    return sourceVisible && targetVisible && relationVisible ? 'block' : 'none';
                });
            }

            if (graph3DRenderer) {
                graph3DRenderer.setShowLinks(showLinks);
                graph3DRenderer.setShowLabels(showLabels);
                graph3DRenderer.setShowLinkLabels(showLinkLabels);
            }

            update3DGraphData();
        }
        
        // 重置节点样式
        function resetNodeStyles() {
            if (node) {
                node.classed('highlighted', false)
                    .attr('fill', d => colorMap[d.type])
                    .attr('stroke', 'none');
            }

            if (text) {
                text.classed('highlighted', false)
                    .style('font-weight', d => d.id === 0 ? 'bold' : 'normal')
                    .style('font-size', d => d.id === 0 ? '14px' : '12px');
            }

            searchHighlightIds = new Set();

            if (graph3DRenderer) {
                graph3DRenderer.setSearchHighlights(searchHighlightIds);
                graph3DRenderer.setCurrentNode(currentNode ? currentNode.id : null);
                graph3DRenderer.refreshStyles();
            }
        }
        
        // 拖动函数 - 确保节点和图形同步移动
        function dragstarted(event, d) {
            // 当自动布局关闭时，我们仍然需要激活模拟，否则节点无法拖动
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            // 如果自动布局关闭，我们不完全停止模拟，而是保持一个非常低的alphaTarget
            // 这样节点仍然可以响应拖拽事件
            if (!event.active) {
                if (document.getElementById('auto-layout').checked) {
                    simulation.alphaTarget(0.3);
                } else {
                    simulation.alphaTarget(0.001);
                }
            }
            d.fx = null;
            d.fy = null;
        }
        
        // 显示节点详情
        function showNodeDetails(event, d) {
            const baseNode = getNodeData(d);
            if (!baseNode) return;

            currentNode = baseNode;
            const detailsPanel = document.querySelector('.node-details');
            document.getElementById('detail-title').textContent = baseNode.name;
            document.getElementById('detail-type').textContent = typeNames[baseNode.type] || baseNode.type;
            document.getElementById('detail-description').textContent = baseNode.description;

            // 清空相关节点
            const relatedNodesContainer = document.getElementById('related-nodes');
            relatedNodesContainer.innerHTML = '';

            // 查找相关节点
            const relatedLinks = graphData.links.filter(link =>
                getNodeId(link.source) === baseNode.id || getNodeId(link.target) === baseNode.id
            );

            const relatedNodeIds = new Set();
            relatedLinks.forEach(link => {
                const sourceId = getNodeId(link.source);
                const targetId = getNodeId(link.target);
                if (sourceId !== baseNode.id) relatedNodeIds.add(sourceId);
                if (targetId !== baseNode.id) relatedNodeIds.add(targetId);
            });

            // 添加相关节点
            relatedNodeIds.forEach(id => {
                const relatedNode = graphData.nodes.find(node => node.id === id);
                if (relatedNode) {
                    const nodeElement = document.createElement('div');
                    nodeElement.className = 'related-node';
                    nodeElement.textContent = relatedNode.name;
                    nodeElement.setAttribute('data-node-id', relatedNode.id);
                    nodeElement.addEventListener('click', (e) => {
                        const nodeId = parseInt(e.target.getAttribute('data-node-id'));
                        focusOnNode(nodeId);
                    });
                    relatedNodesContainer.appendChild(nodeElement);
                }
            });
            
            // 清空并填充人物小传
            const bioListContainer = document.getElementById('bio-list');
            bioListContainer.innerHTML = '';

            if (baseNode.highlights && baseNode.highlights.length > 0) {
                baseNode.highlights.forEach(item => {
                    const bioItem = document.createElement('p');
                    bioItem.className = 'bio-item';
                    bioItem.textContent = item;
                    bioListContainer.appendChild(bioItem);
                });
            } else {
                const noBio = document.createElement('p');
                noBio.className = 'bio-empty';
                noBio.textContent = '暂无更多人物介绍';
                bioListContainer.appendChild(noBio);
            }
            
            // 显示详情面板
            detailsPanel.style.display = 'block';

            // 高亮当前节点
            resetNodeStyles();
            if (node) {
                node.filter(nodeDatum => nodeDatum.id === currentNode.id)
                    .classed('highlighted', true)
                    .attr('stroke', '#ffcc00')
                    .attr('stroke-width', 3);
            }

            if (text) {
                text.filter(nodeDatum => nodeDatum.id === currentNode.id)
                    .classed('highlighted', true);
            }

            if (graph3DRenderer) {
                graph3DRenderer.setCurrentNode(currentNode ? currentNode.id : null);
                graph3DRenderer.refreshStyles();
            }
        }

        // 定位到特定节点
        function focusOnNode(nodeId) {
            const nodeData = getNodeData(nodeId);
            if (!nodeData) return;

            if (currentView === '3d' && graph3DRenderer) {
                graph3DRenderer.focusNode(nodeId);
                graph3DRenderer.setCurrentNode(nodeId);
                graph3DRenderer.refreshStyles();
                showNodeDetails(null, nodeData);
                return;
            }

            const width = document.getElementById('knowledge-graph').clientWidth;
            const height = document.getElementById('knowledge-graph').clientHeight;

            const nodePosition = lastNodePositions[nodeId] || { x: width / 2, y: height / 2 };

            const scale = 2.5;
            const x = width / 2 - scale * nodePosition.x;
            const y = height / 2 - scale * nodePosition.y;

            if (svg) {
                svg.transition()
                    .duration(750)
                    .call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(scale));
            }

            showNodeDetails(null, nodeData);
        }

        function init3DGraph() {
            const container = document.getElementById('graph-3d');
            if (!container) return;

            clearGraphError();

            if (!graph3DRenderer) {
                graph3DRenderer = create3DRenderer(container, {
                    onNodeClick: node => focusOnNode(node.id),
                    getNodeColor: get3DNodeColor,
                    getLinkColor: link => relationColorMap[link.type] || '#999',
                    getNodeLabel: node => node.name
                });
            }

            const showLinks = document.getElementById('show-links') ? document.getElementById('show-links').checked : true;
            const showLabels = document.getElementById('show-labels') ? document.getElementById('show-labels').checked : true;
            const showLinkLabels = document.getElementById('show-link-labels') ? document.getElementById('show-link-labels').checked : false;
            const autoLayoutEnabled = document.getElementById('auto-layout') ? document.getElementById('auto-layout').checked : true;

            graph3DRenderer.setShowLinks(showLinks);
            graph3DRenderer.setShowLabels(showLabels);
            graph3DRenderer.setShowLinkLabels(showLinkLabels);
            graph3DRenderer.setAutoLayoutEnabled(autoLayoutEnabled);

            const { width, height } = getGraphContainerSize();
            graph3DRenderer.resize(width, height);
            update3DGraphData();
            graph3DRenderer.setSearchHighlights(searchHighlightIds);
            graph3DRenderer.setCurrentNode(currentNode ? currentNode.id : null);
            graph3DRenderer.refreshStyles();
            show3DHintOverlay();
        }

        function update3DGraphData() {
            if (!graph3DRenderer) {
                return;
            }

            const selectedDomains = activeDomains && activeDomains.length > 0
                ? activeDomains
                : Array.from(new Set(rawGraphData.nodes.map(node => node.type)));

            const selectedRelations = activeRelations && activeRelations.length > 0
                ? activeRelations
                : Array.from(new Set(rawGraphData.links.map(link => link.type)));

            const filteredNodes = rawGraphData.nodes
                .filter(node => selectedDomains.includes(node.type))
                .map(node => ({ ...node }));

            const allowedNodeIds = new Set(filteredNodes.map(node => node.id));

            const filteredLinks = rawGraphData.links
                .filter(link => {
                    const sourceId = getNodeId(link.source);
                    const targetId = getNodeId(link.target);
                    const sourceNode = rawNodeMap.get(sourceId);
                    const targetNode = rawNodeMap.get(targetId);
                    if (!sourceNode || !targetNode) return false;
                    const domainVisible = selectedDomains.includes(sourceNode.type) && selectedDomains.includes(targetNode.type);
                    return domainVisible && selectedRelations.includes(link.type);
                })
                .map(link => ({
                    source: getNodeId(link.source),
                    target: getNodeId(link.target),
                    relation: link.relation,
                    type: link.type
                }));

            const showLinksControl = document.getElementById('show-links');
            const showLabelsControl = document.getElementById('show-labels');
            const showLinkLabelsControl = document.getElementById('show-link-labels');
            const autoLayoutControl = document.getElementById('auto-layout');

            graph3DRenderer.setData(filteredNodes, filteredLinks);
            graph3DRenderer.setNodeColorGetter(get3DNodeColor);
            graph3DRenderer.setLinkColorGetter(link => relationColorMap[link.type] || '#999');
            if (showLinksControl) {
                graph3DRenderer.setShowLinks(showLinksControl.checked);
            }
            if (showLabelsControl) {
                graph3DRenderer.setShowLabels(showLabelsControl.checked);
            }
            if (showLinkLabelsControl) {
                graph3DRenderer.setShowLinkLabels(showLinkLabelsControl.checked);
            }
            if (autoLayoutControl) {
                graph3DRenderer.setAutoLayoutEnabled(autoLayoutControl.checked);
            }

            const highlightId = currentNode && allowedNodeIds.has(currentNode.id) ? currentNode.id : null;
            graph3DRenderer.setCurrentNode(highlightId);
            graph3DRenderer.setSearchHighlights(searchHighlightIds);
            graph3DRenderer.refreshStyles();
        }

        function switchGraphView(targetView) {
            if (targetView === currentView) return;

            currentView = targetView;
            const svgElement = document.getElementById('knowledge-graph');
            const graph3DContainer = document.getElementById('graph-3d');
            const toolbar = document.querySelector('.toolbar');

            if (currentView === '3d') {
                svgElement.style.display = 'none';
                graph3DContainer.style.display = 'block';
                if (toolbar) {
                    toolbar.style.display = 'none';
                }
                init3DGraph();
            } else {
                svgElement.style.display = 'block';
                graph3DContainer.style.display = 'none';
                hide3DHintOverlay();
                if (toolbar) {
                    toolbar.style.display = 'flex';
                }
                init2DGraph();
            }
        }

        function resize3DGraph() {
            if (!graph3DRenderer) return;
            const { width, height } = getGraphContainerSize();
            graph3DRenderer.resize(width, height);
        }

        function bootstrapGraphs() {
            init2DGraph();
            update3DGraphData();

            window.addEventListener('resize', () => {
                if (currentView === '2d') {
                    init2DGraph();
                } else {
                    resize3DGraph();
                }
            });
        }

        if (typeof d3 === 'undefined') {
            document.addEventListener('DOMContentLoaded', () => {
                showGraphError('图谱渲染所需的 D3 库未能加载，请检查网络连接后刷新页面。');
                const radio3d = document.querySelector('input[value="3d"]');
                if (radio3d) {
                    radio3d.disabled = true;
                }
            });
        } else {
            document.addEventListener('DOMContentLoaded', bootstrapGraphs);
        }
    </script>
</body>
</html>
